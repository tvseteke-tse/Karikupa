<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Karácsony kupa 2026. - Élő Ranglista</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #00122e;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
        user-select: none;
    }

    .board-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #001c47;
        padding: 10px 15px;
        box-shadow: inset 0 0 25px rgba(0, 50, 150, 0.6);
    }

    /* Fejléc */
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 8px;
        border-bottom: 2px solid #0044aa;
        flex-shrink: 0;
        min-height: 50px;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 220px;
    }

    .connection-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
        color: #8b949e;
        font-weight: bold;
    }

    .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #ff3333;
        box-shadow: 0 0 8px #ff3333;
        display: inline-block;
    }
    .status-dot.connected {
        background-color: #00ff66;
        box-shadow: 0 0 8px #00ff66;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
    }

    .fullscreen-btn {
        background: #002b66;
        color: #ffffff;
        border: 1px solid #0044aa;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s;
    }
    .fullscreen-btn:hover { background: #0055ff; color: #ffff00; }

    h1 {
        margin: 0;
        font-size: 1.8rem;
        color: #ffff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
        flex-grow: 1;
        text-shadow: 0 0 10px rgba(255, 255, 0, 0.4);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 15px;
    }

    .header-right {
        min-width: 220px;
        text-align: right;
        font-size: 1.4rem;
        font-weight: bold;
        color: #ffffff;
        font-family: 'Courier New', Courier, monospace;
    }

    /* Többoszlopos tartalom */
    .content-area {
        flex-grow: 1;
        display: flex;
        overflow: hidden;
        padding-top: 8px;
    }

    .columns-wrapper {
        display: grid;
        width: 100%;
        height: 100%;
        gap: 12px;
    }

    .column-panel {
        background: rgba(0, 28, 71, 0.7);
        border: 1px solid #0044aa;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
        table-layout: fixed;
    }

    th {
        color: #ffff00;
        background: #002255;
        border-bottom: 2px solid #0044aa;
        padding: var(--header-padding, 6px) 2px;
        font-size: var(--header-font-size, 0.9rem);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
    }

    td {
        padding: var(--row-padding-y, 4px) 2px;
        text-align: center;
        border-bottom: 1px solid #002b66;
        font-size: var(--row-font-size, 1rem);
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Oszloparányok (colgroup) */
    .col-rank { width: 5.5%; }
    .col-name { width: 25%; text-align: left; font-family: sans-serif; color: #ffff00; }
    .col-team { width: 29%; text-align: left; font-family: sans-serif; color: #00ff66; }
    .col-total { width: 12%; font-weight: bold; }
    .col-teli { width: 9.5%; color: #8b949e; }
    .col-tarol { width: 9.5%; color: #8b949e; }
    .col-ures { width: 9.5%; color: #8b949e; }

    .rank-col { color: #ffffff; text-align: center; }
    
    .color-green { color: #00ff66 !important; text-shadow: 0 0 4px rgba(0, 255, 102, 0.4); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 4px rgba(255, 255, 0, 0.4); }
    .color-red { color: #ff3333 !important; text-shadow: 0 0 4px rgba(255, 51, 51, 0.4); }

    tr.top3 { background-color: rgba(0, 68, 170, 0.4); }
    tr.top3 .rank-col { color: #ffff00; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="board-container">
    <header>
        <div class="header-left">
            <div class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Kapcsolódás...</span>
            </div>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">Teljes képernyő</button>
        </div>
        <h1 id="boardTitle">KARÁCSONY KUPA 2026.</h1>
        <div class="header-right" id="clockDisplay">00:00</div>
    </header>

    <div class="content-area" id="contentArea">
        <div class="columns-wrapper" id="columnsWrapper"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let categories = [];
let categoriesData = {};
let activeCatIndex = 0;
let autoRotateTimer = null;
let isConnected = false;
let fallbackTimer = null;

// Óra frissítés (másodpercek nélkül)
function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clockDisplay').innerText = `${hours}:${minutes}`;
}
setInterval(updateClock, 1000);
updateClock();

// Teljes képernyő váltó
function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.error("Hiba történt a teljes képernyőre váltáskor:", err);
        });
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

// Firebase kapcsolat figyelése
db.ref('.info/connected').on('value', (snap) => {
    isConnected = (snap.val() === true);
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (isConnected) {
        dot.className = 'status-dot connected';
        txt.innerText = 'Élő';
    } else {
        dot.className = 'status-dot';
        txt.innerText = 'Kapcsolódás...';
    }
});

// Adatok betöltése Firebase-ből
db.ref('karikupa_egyeni').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) {
        if (fallbackTimer) clearTimeout(fallbackTimer);
        categories = val.categories || [];
        categoriesData = val.data || {};
        if (activeCatIndex >= categories.length) {
            activeCatIndex = 0;
        }
        renderCurrentCategory();
    }
}, (error) => {
    console.error("Firebase olvasási hiba:", error);
});

// 2.5mp után ha nincs adat, mintaadatok betöltése előnézethez
fallbackTimer = setTimeout(() => {
    if (categories.length === 0) {
        loadMockData();
    }
}, 2500);

function loadMockData() {
    categories = [
        { id: 'cat1', name: 'Felnőtt Férfi' },
        { id: 'cat2', name: 'Felnőtt Női' }
    ];
    categoriesData = {
        'cat1': {
            title: 'Felnőtt Férfi Egyéni',
            players: Array.from({length: 32}, (_, i) => ({
                name: i === 0 ? 'Kecskeméti Szebasztián' : `Versenyző ${i+1}`,
                team: 'Tiszakécske TSE',
                total: Math.max(450, 630 - (i * 4)),
                teli: 380,
                tarol: Math.max(150, 250 - i),
                ures: i % 5
            }))
        },
        'cat2': {
            title: 'Felnőtt Női Egyéni',
            players: Array.from({length: 24}, (_, i) => ({
                name: i === 0 ? 'Goórné Fodor Eszter' : `Játékos ${i+1}`,
                team: 'Szolnoki MÁV',
                total: Math.max(420, 580 - (i * 5)),
                teli: 350,
                tarol: Math.max(120, 230 - i),
                ures: (i + 2) % 6
            }))
        }
    };
    renderCurrentCategory();
}

// 60 másodperces automatikus lapváltás
function startAutoRotate() {
    if (autoRotateTimer) clearInterval(autoRotateTimer);
    autoRotateTimer = setInterval(() => {
        if (categories.length > 1) {
            activeCatIndex = (activeCatIndex + 1) % categories.length;
            renderCurrentCategory();
        }
    }, 60000);
}
startAutoRotate();

function getTotalColorClass(val) {
    if (val === 0) return '';
    if (val > 600) return 'color-green';
    if (val < 500) return 'color-red';
    return 'color-yellow';
}

function getUresColorClass(val) {
    if (val === 0) return 'color-green';
    if (val <= 5) return 'color-yellow';
    return 'color-red';
}

// Fő renderelő és dinamikus méretező motor
function renderCurrentCategory() {
    if (categories.length === 0) return;
    const catMeta = categories[activeCatIndex];
    const catData = categoriesData[catMeta.id] || { title: catMeta.name, players: [] };
    
    document.getElementById('boardTitle').innerText = (catData.title || catMeta.name).toUpperCase();

    const players = catData.players || [];
    const sorted = [...players].sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        if (b.tarol !== a.tarol) return b.tarol - a.tarol;
        if (a.ures !== b.ures) return a.ures - b.ures;
        return 0;
    });

    const totalCount = sorted.length;
    const contentArea = document.getElementById('contentArea');
    const availableWidth = contentArea.clientWidth - 30;
    const availableHeight = contentArea.clientHeight - 10;

    // Oszlopszám és betűméret kiszámítása a tökéletes görgetésmentes megjelenítéshez
    let bestCols = 1;
    let bestFontSize = 15;
    let bestPaddingY = 5;
    let bestHeaderFontSize = 13;
    let bestHeaderPadding = 6;

    for (let cols = 1; cols <= 4; cols++) {
        const rowsPerCol = Math.ceil(totalCount / cols);
        const colWidth = availableWidth / cols;
        if (cols > 1 && colWidth < 300) continue;

        for (let fs = 20; fs >= 10; fs -= 0.5) {
            const py = Math.max(2, fs * 0.32);
            const hfs = Math.max(10, fs * 0.85);
            const hpy = Math.max(3, py * 0.8);
            const rowHeight = (fs * 1.4) + (py * 2) + 1; // 1px border
            const headerHeight = hfs + (hpy * 2) + 4;
            const totalPanelHeight = headerHeight + (rowsPerCol * rowHeight);

            if (totalPanelHeight <= availableHeight && colWidth >= 280) {
                if (fs > bestFontSize || cols > bestCols) {
                    bestCols = cols;
                    bestFontSize = fs;
                    bestPaddingY = py;
                    bestHeaderFontSize = hfs;
                    bestHeaderPadding = hpy;
                }
