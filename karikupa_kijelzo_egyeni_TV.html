<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karácsony kupa 2026. - Élő Ranglista</title>
    <!-- Tailwind CSS betöltése -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Betűtípusok: Inter a szövegekhez, JetBrains Mono az eredménytábla számaihoz -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --row-font-size: 16px;
            --header-font-size: 13px;
            --total-font-size: 19px;
            --row-padding-y: 5px;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #00122e;
            background-image: radial-gradient(circle at 50% 0%, #002b66 0%, #00122e 75%);
            color: #ffff00;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        .font-mono-score {
            font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Eredeti színkódolás LED ragyogással */
        .color-green {
            color: #00ff66 !important;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.45);
        }
        .color-yellow {
            color: #ffff00 !important;
            text-shadow: 0 0 8px rgba(255, 255, 0, 0.45);
        }
        .color-red {
            color: #ff3333 !important;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.45);
        }

        /* Dinamikus táblázat cella méretezések */
        .dyn-th {
            font-size: var(--header-font-size);
            padding-top: calc(var(--row-padding-y) + 2px);
            padding-bottom: calc(var(--row-padding-y) + 2px);
            line-height: 1.15;
        }

        .dyn-td {
            font-size: var(--row-font-size);
            padding-top: var(--row-padding-y);
            padding-bottom: var(--row-padding-y);
            line-height: 1.15;
        }

        .dyn-total {
            font-size: var(--total-font-size);
            padding-top: var(--row-padding-y);
            padding-bottom: var(--row-padding-y);
            line-height: 1.1;
        }

        /* Kiemelt dobogós sorok */
        tr.top3 {
            background: linear-gradient(90deg, rgba(0, 85, 255, 0.38) 0%, rgba(0, 68, 170, 0.5) 50%, rgba(0, 85, 255, 0.38) 100%);
        }
        tr.top3 td {
            border-bottom-color: rgba(255, 255, 0, 0.28);
        }

        /* Pulzáló élő státusz pont */
        @keyframes pulse-live {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.55; }
        }
        .live-dot {
            animation: pulse-live 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="p-2 sm:p-3 flex flex-col box-border">

    <!-- Fő kijelző keret (100% magasság, görgetés nélkül) -->
    <div class="w-full h-full bg-[#001c47]/95 border-2 border-[#0044aa] rounded-2xl p-2.5 sm:p-3.5 shadow-[0_0_35px_rgba(0,50,150,0.65)] flex flex-col overflow-hidden">
        
        <!-- Felső információs és vezérlősáv -->
        <div id="topBar" class="flex flex-wrap items-center justify-between gap-2 pb-2 mb-2 border-b border-[#0044aa]/70 shrink-0">
            <!-- Bal oldal: Élő kapcsolat + Főcím + Indulók száma -->
            <div class="flex items-center gap-3 min-w-0">
                <div class="flex items-center gap-2 bg-[#00122e]/90 border border-[#0044aa] px-2.5 py-1 rounded-xl shrink-0">
                    <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-yellow-400 live-dot inline-block shadow-[0_0_8px_#ffff00]"></span>
                    <span id="statusText" class="text-[11px] sm:text-xs font-bold tracking-wider uppercase text-yellow-300">CSATLAKOZÁS...</span>
                </div>

                <div class="min-w-0">
                    <h1 id="boardTitle" class="text-base sm:text-xl lg:text-2xl font-black text-[#ffff00] tracking-wider uppercase truncate drop-shadow-[0_0_10px_rgba(255,255,0,0.4)]">
                        KARÁCSONY KUPA 2027.
                    </h1>
                </div>
            </div>

            <!-- Közép: Kategória választó fülek -->
            <div id="tabsContainer" class="flex flex-wrap gap-1.5 justify-center"></div>

            <!-- Jobb oldal: Kivetítő vezérlőgombok + Óra -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button id="demoToggleBtn" onclick="toggleDemoMode()" class="hidden bg-[#002b66] hover:bg-[#003d8f] text-yellow-300 border border-[#0055ff] px-2.5 py-1 rounded-xl text-xs font-bold transition cursor-pointer">
                    Minta: KI
                </button>

                <button id="autoCycleBtn" onclick="toggleAutoCycle()" title="Kategóriák automatikus léptetése 15 másodpercenként" class="bg-[#002b66] hover:bg-[#003d8f] text-white border border-[#0044aa] px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 cursor-pointer">
                    <svg class="w-3.5 h-3.5 text-[#00ff66]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span id="autoCycleLabel">Auto: KI</span>
                </button>

                <button onclick="toggleFullscreen()" title="Teljes képernyős mód" class="bg-[#002b66] hover:bg-[#003d8f] text-white border border-[#0044aa] px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 cursor-pointer">
                    <svg class="w-3.5 h-3.5 text-[#ffff00]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                    </svg>
                    <span class="hidden md:inline">Teljes képernyő</span>
                </button>

                <div id="liveClock" class="font-mono-score bg-[#00122e] border border-[#0044aa] text-[#00ff66] px-2.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold tracking-wider">
                    00:00:00
                </div>
            </div>
        </div>

        <!-- Mintaadat figyelmeztető sáv -->
        <div id="demoBanner" class="hidden mb-2 bg-[#002b66] border border-[#ffff00]/60 text-yellow-200 px-3 py-1 rounded-xl text-xs flex items-center justify-between gap-2 shrink-0">
            <span><strong>Előnézeti mód:</strong> Mintaadatok láthatók, mert a Firebase adatbázis még üres. Élő adat érkezésekor a kijelző azonnal átvált.</span>
            <button onclick="toggleDemoMode()" class="underline font-bold text-[#ffff00] whitespace-nowrap cursor-pointer">Elrejtés</button>
        </div>

        <!-- Többoszlopos eredménytábla terület (maradék hely 100%-át kitölti, görgetés nélkül) -->
        <div id="columnsWrapper" class="flex-1 min-h-0 w-full grid gap-2.5 overflow-hidden">
            <!-- Dinamikusan generált oszlopok / táblázatok -->
        </div>

        <!-- Kompakt lábléc -->
        <div id="bottomBar" class="mt-2 pt-1.5 border-t border-[#0044aa]/60 flex flex-wrap items-center justify-between gap-2 text-[11px] sm:text-xs text-blue-200/80 shrink-0">
            <div class="flex flex-wrap items-center gap-3">
                <span id="playerCountSubtitle" class="font-bold text-white">Várakozás az eredményekre...</span>
                <span class="hidden sm:inline text-blue-500">|</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#00ff66] inline-block"></span> Össz &gt; 600 / Üres = 0</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#ffff00] inline-block"></span> Össz 500–600 / Üres 1–5</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#ff3333] inline-block"></span> Össz &lt; 500 / Üres &gt; 5</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="layoutInfoText" class="font-mono-score text-blue-300/70"></span>
                <span id="lastUpdateText" class="font-mono-score text-blue-300/80">Utolsó frissítés: -</span>
            </div>
        </div>
    </div>

    <script>
        // Firebase konfiguráció
        const firebaseConfig = {
            apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.appspot.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeCatId = '';
        let categories = [];
        let categoriesData = {};
        let hasLiveData = false;
        let isDemoMode = false;
        let autoCycleInterval = null;

        // Előnézeti mintaadatok (ha még nincs élő adat az adatbázisban)
        const DEMO_CATEGORIES = [
            { id: 'ferfi_igazolt', name: 'Férfi Igazolt' },
            { id: 'noi_igazolt', name: 'Női Igazolt' },
            { id: 'amator', name: 'Amatőr Kategória' }
        ];

        function generateDemoPlayers(count, baseScore) {
            const firstNames = ['Kovács', 'Nagy', 'Szabó', 'Tóth', 'Horváth', 'Varga', 'Kiss', 'Molnár', 'Németh', 'Farkas', 'Balogh', 'Papp', 'Takács', 'Juhász', 'Lakatos', 'Mészáros', 'Oláh', 'Simon', 'Rácz', 'Fekete'];
            const lastNames = ['János', 'Péter', 'Gábor', 'László', 'Zoltán', 'István', 'Tamás', 'Attila', 'Sándor', 'József', 'Ferenc', 'Tibor', 'Zsolt', 'Csaba', 'András', 'Imre', 'Lajos', 'Gyula', 'Róbert', 'Balázs'];
            const teams = ['Tiszakécske VSE', 'Szolnoki MÁV', 'Kecskeméti TC', 'Ceglédi VSE', 'Bácsalmási PVSE', 'Ferencvárosi TC', 'Zalaegerszegi TE', 'Szegedi TE', 'Répcelaki SE', 'Kaposvári TK'];
            const list = [];
            for (let i = 0; i < count; i++) {
                const total = Math.max(430, baseScore - i * 4 - (i % 3));
                const tarol = Math.round(total * 0.34);
                const teli = total - tarol;
                const ures = total > 600 ? 0 : (total >= 500 ? (i % 5) + 1 : 6 + (i % 4));
                list.push({
                    name: `${firstNames[i % firstNames.length]} ${lastNames[(i * 3) % lastNames.length]}`,
                    team: teams[i % teams.length],
                    teli,
                    tarol,
                    ures,
                    total
                });
            }
            return list;
        }

        const DEMO_DATA = {
            ferfi_igazolt: {
                title: 'KARÁCSONY KUPA 2027. - FÉRFI IGAZOLT',
                players: generateDemoPlayers(38, 636)
            },
            noi_igazolt: {
                title: 'KARÁCSONY KUPA 2027. - NŐI IGAZOLT',
                players: generateDemoPlayers(22, 618)
            },
            amator: {
                title: 'KARÁCSONY KUPA 2027. - AMATŐR',
                players: generateDemoPlayers(44, 592)
            }
        };

        // Élő óra
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Firebase kapcsolat figyelése
        db.ref('.info/connected').on('value', (snap) => {
            const connected = snap.val() === true;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (connected) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-[#00ff66] live-dot inline-block shadow-[0_0_8px_#00ff66]';
                text.className = 'text-[11px] sm:text-xs font-bold tracking-wider uppercase text-[#00ff66]';
                text.innerText = 'ÉLŐ KAPCSOLAT';
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-[#ff3333] inline-block shadow-[0_0_8px_#ff3333]';
                text.className = 'text-[11px] sm:text-xs font-bold tracking-wider uppercase text-[#ff3333]';
                text.innerText = 'OFFLINE...';
            }
        });

        // Firebase 'karikupa_egyeni' adatfolyam figyelése
        db.ref('karikupa_egyeni').on('value', (snapshot) => {
            const val = snapshot.val();
            const nowStr = new Date().toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('lastUpdateText').innerText = `Utolsó frissítés: ${nowStr}`;

            if (val && (val.categories || val.data)) {
                hasLiveData = true;
                isDemoMode = false;
                document.getElementById('demoBanner').classList.add('hidden');
                document.getElementById('demoToggleBtn').classList.add('hidden');

                categories = val.categories || [];
                categoriesData = val.data || {};

                if (categories.length > 0) {
                    if (!activeCatId || !categories.find(c => c.id === activeCatId)) {
                        activeCatId = categories[0].id;
                    }
                }
                renderCategoryTabs();
                renderCurrentCategory();
            } else if (!hasLiveData) {
                document.getElementById('demoToggleBtn').classList.remove('hidden');
                renderCurrentCategory();
            }
        });

        // 2,5 másodperc után előnézeti mód, ha még nincs élő adat
        setTimeout(() => {
            if (!hasLiveData && categories.length === 0) {
                enableDemoMode();
            }
        }, 2500);

        function enableDemoMode() {
            if (hasLiveData) return;
            isDemoMode = true;
            categories = DEMO_CATEGORIES;
            categoriesData = DEMO_DATA;
            activeCatId = categories[0].id;
            document.getElementById('demoBanner').classList.remove('hidden');
            const btn = document.getElementById('demoToggleBtn');
            btn.classList.remove('hidden');
            btn.innerText = 'Minta: BE';
            renderCategoryTabs();
            renderCurrentCategory();
        }

        function toggleDemoMode() {
            if (hasLiveData) return;
            isDemoMode = !isDemoMode;
            const btn = document.getElementById('demoToggleBtn');
            if (isDemoMode) {
                categories = DEMO_CATEGORIES;
                categoriesData = DEMO_DATA;
                activeCatId = categories[0].id;
                document.getElementById('demoBanner').
